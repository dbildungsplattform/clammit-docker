name: 'Publish image to GHCR on push to branch'

on:
  push:
    branches-ignore:
      - 'main'

concurrency:
  group: clammit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_push:
    permissions:
      packages: write
      security-events: write
      contents: read
    uses: dBildungsplattform/dbp-github-workflows/.github/workflows/image-publish-trivy.yaml@4b5c0434f28b537e9199ffebc21f4e6e39cbcdde # 8.4.3
    with:
      image_name: "clammit"
      run_trivy_scan: true
      image_tag_generation: "ticket_from_branch"
      add_latest_tag: false
      container_registry: "ghcr.io"
